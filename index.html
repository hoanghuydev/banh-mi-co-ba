  /* CANON §15: font sans, line-height rộng (tiếng Việt chồng dấu: ề ộ ỡ ữ), không viết hoa toàn bộ. */
  :root {
    --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px);
  }
  html, body {
    margin: 0; height: 100%; height: 100dvh; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    background: #1d232b;
    font-family: "Be Vietnam Pro", ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    color: #e8eef3;
    -webkit-font-smoothing: antialiased;
  }
  /* Khung cuộn cắt chuỗi touch-action của tổ tiên, nên đặt cho mọi phần tử để chạm hai lần không zoom. */
  * { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  #game { position: fixed; top: 0; bottom: 0; left: var(--safe-left); right: var(--safe-right); touch-action: none; }
  #game canvas { display: block; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #1d232b; z-index: 20; transition: opacity .35s ease; overflow: hidden;
  }
  #boot::before {
    content: ""; position: absolute; inset: -24px;
    background: url(art/boot_bg.webp) center / cover no-repeat;
    filter: blur(7px) brightness(.5) saturate(.9);
  }
  #boot::after {
    content: ""; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 42% 58% at 50% 50%, rgba(255,196,110,.22), rgba(255,196,110,0) 70%),
      radial-gradient(ellipse 75% 85% at 50% 50%, rgba(8,10,14,0) 35%, rgba(8,10,14,.7) 100%);
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  /*
   * `rem` chứ không `px`: màn mở là DOM thuần, nó nằm NGOÀI bốn mức cỡ chữ của P5-01 §2.1
   * (mấy mức đó sống trong canvas Phaser, mà lúc này Phaser còn chưa chạy). Thứ duy nhất
   * người cần chữ to còn chỉnh được ở đây là cỡ chữ mặc định của trình duyệt — để `px` là
   * chặn luôn đường đó. Bề ngang cũng vậy, và còn phải co được trên màn hẹp.
   */
  #boot-box { position: relative; z-index: 1; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.8); width: min(22rem, calc(100vw - 3rem)); }
  #boot-logo { display: block; width: auto; max-width: 100%; height: auto; max-height: max(7rem, calc(100vh - 16rem)); max-height: max(7rem, calc(100dvh - 16rem)); margin: 0 auto; filter: drop-shadow(0 8px 10px rgba(0,0,0,.55)); }

  /* Nhân vật đi dọc thanh tiến độ: --p (0…1) do bootScreen.ts đặt. */
  #boot-track { position: relative; margin-top: 8.8rem; --w: 3.6rem; }
  #boot-walker {
    position: absolute; bottom: calc(100% - 3px); left: calc((100% - var(--w)) * var(--p, 0));
    width: var(--w); height: calc(var(--w) * 288 / 139);
    background: url(art/boot_walk.webp) 0 0 / calc(var(--w) * 8) 100% no-repeat;
    animation: boot-walk .8s steps(8) infinite; transition: left .2s linear;
  }
  /* Màn ngang thấp: logo đứng cạnh thanh tiến độ thay vì chồng lên. */
  @media (orientation: landscape) and (max-height: 520px) {
    #boot-box { width: min(34rem, calc(100vw - 3rem)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 1.5rem; align-items: end; }
    #boot-logo { grid-row: 1 / 3; max-height: calc(100dvh - 3rem); align-self: center; }
    #boot-track { margin-top: 0; align-self: end; }
    #boot-row { align-self: start; }
  }
  @keyframes boot-walk { to { background-position-x: calc(var(--w) * -8); } }

  /* Rãnh có viền riêng: nền rãnh chỉ hơn nền trang một chút, không viền thì mắt loạn thị
     không thấy thanh DÀI tới đâu, chỉ thấy đoạn vàng nổi lơ lửng. */
  #boot-bar {
    height: 14px; border-radius: 999px; overflow: hidden;
    background-color: #232a33; border: 1px solid #3a444e;
    box-shadow: inset 0 3px 4px rgba(0,0,0,.6), 0 2px 0 #0f1318, 0 5px 8px rgba(0,0,0,.45);
  }
  /* #f0c419 = màu tên NPC của P5-01 §2.1.3 — 9,6:1 trên nền này. Xem src/ui/bootScreen.ts. */
  #boot-fill {
    display: block; height: 100%; width: 0; border-radius: 999px;
    background: linear-gradient(#ffe483, #f0c419 45%, #c79a06);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 3px rgba(110,70,0,.55);
    transition: width .2s linear;
  }
  /*
   * Trạng thái KHÔNG XÁC ĐỊNH: bó mã còn đang tải nên chưa có số nào để hiện.
   *
   * Vạch trôi vẽ bằng gradient của RÃNH, không phải bằng bề rộng của #boot-fill. Cho
   * #boot-fill một bề rộng ở đây thì lúc rời trạng thái này nó phải co từ 34% về 2%, và
   * `transition: width` làm cú co đó thành một đoạn CHẠY NGƯỢC ngay trước khi tiến độ
   * thật bắt đầu. Để fill đứng ở 0 thì không có gì phải co.
   */
  #boot-bar.boot-wait {
    background-image: linear-gradient(90deg, transparent, #f0c419, transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: boot-slide 1.3s ease-in-out infinite;
  }
  @keyframes boot-slide {
    0%, 100% { background-position: -45% 0; }
    50%      { background-position: 145% 0; }
  }
  /* 0,9rem = 14,4px ở mặc định — trên sàn 14px của P5-01 §2.1.1. */
  #boot-row {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 9px; font-size: .9rem; letter-spacing: .02em; opacity: .8;
  }
  /* Chữ số không nhảy chỗ khi đổi từ "9%" sang "10%", và không bao giờ bị xuống dòng. */
  #boot-pct { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Chuyển cảnh qua ngày: cửa cuốn đóng rồi mờ hoặc kéo lên, màn đêm tối dần. Điều khiển bởi src/ui/transition.ts. */
  #shutter {
    position: fixed; inset: 0; z-index: 19; pointer-events: none;
    background: #4a545c url(art/cua_cuon.webp) center / cover no-repeat;
    transform: translateY(-101%); transition: transform .9s cubic-bezier(.45, 0, .55, 1);
    box-shadow: 0 10px 24px rgba(0,0,0,.55);
  }
  #shutter.down { transform: none; pointer-events: auto; }
  #shutter.fade { opacity: 0; pointer-events: none; transition: opacity .7s ease; }
  #night {
    position: fixed; inset: 0; z-index: 19; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(ellipse 70% 70% at 50% 45%, #1a2430, #070a0e); opacity: 0; transition: opacity .8s ease;
    color: #e8eef3; font-size: 1.9rem; font-weight: 800; letter-spacing: .04em; text-shadow: 0 2px 8px rgba(0,0,0,.7);
  }
  #night.on { opacity: 1; pointer-events: auto; }
  @media (prefers-reduced-motion: reduce) { #shutter, #night { transition: none; } }

  @media (prefers-reduced-motion: reduce) {
    #boot { transition: none; }
    #boot-fill { transition: none; }
    #boot-walker { animation: none; transition: none; }
    /* Vạch trôi tắt HẲN, không đổi sang hiệu ứng khác. Dòng chữ bên dưới vẫn nói đang
       khởi động, nên bỏ cái vạch này không làm mất thông tin nào (P5-01 §1). */
    #boot-bar.boot-wait { animation: none; background-image: none; }
    #boot-bar.boot-wait > #boot-fill { width: 12%; }
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="shutter"></div>
  <div id="night"></div>
  <div id="boot">
    <div id="boot-box">
      <img id="boot-logo" src="art/logo.webp" width="760" height="720" alt="Bye Sếp, Em Bán Bánh Mì" />
      <div id="boot-track">
        <div id="boot-walker" aria-hidden="true"></div>
        <div id="boot-bar" class="boot-wait" role="progressbar" aria-labelledby="boot-note"
             aria-valuemin="0" aria-valuemax="100"><i id="boot-fill"></i></div>
      </div>
      <div id="boot-row">
        <span id="boot-note" aria-live="polite">đang khởi động…</span>
        <span id="boot-pct"></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
