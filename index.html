<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Bánh Mì Cô Ba</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* CANON §15: font sans, line-height rộng (tiếng Việt chồng dấu: ề ộ ỡ ữ), không viết hoa toàn bộ. */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1d232b;
    font-family: "Be Vietnam Pro", ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    color: #e8eef3;
    -webkit-font-smoothing: antialiased;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #1d232b; z-index: 20; transition: opacity .35s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot div { text-align: center; opacity: .75; font-size: 14px; letter-spacing: .02em; }
  #boot b { display: block; font-size: 22px; font-weight: 700; margin-bottom: 6px; letter-spacing: .01em; }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div><b>Bánh Mì Cô Ba</b>đang dọn hàng…</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
