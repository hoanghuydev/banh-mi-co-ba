<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Bánh Mì Cô Ba</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  /* CANON §15: font sans, line-height rộng (tiếng Việt chồng dấu: ề ộ ỡ ữ), không viết hoa toàn bộ. */
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #1d232b;
    font-family: "Be Vietnam Pro", ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    line-height: 1.55;
    color: #e8eef3;
    -webkit-font-smoothing: antialiased;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #1d232b; z-index: 20; transition: opacity .35s ease;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  /*
   * `rem` chứ không `px`: màn mở là DOM thuần, nó nằm NGOÀI bốn mức cỡ chữ của P5-01 §2.1
   * (mấy mức đó sống trong canvas Phaser, mà lúc này Phaser còn chưa chạy). Thứ duy nhất
   * người cần chữ to còn chỉnh được ở đây là cỡ chữ mặc định của trình duyệt — để `px` là
   * chặn luôn đường đó. Bề ngang cũng vậy, và còn phải co được trên màn hẹp.
   */
  #boot-box { text-align: center; width: min(17rem, calc(100vw - 3rem)); }
  #boot b { display: block; font-size: 1.4rem; font-weight: 700; margin-bottom: 14px; letter-spacing: .01em; }

  /* Rãnh có viền riêng: nền rãnh chỉ hơn nền trang một chút, không viền thì mắt loạn thị
     không thấy thanh DÀI tới đâu, chỉ thấy đoạn vàng nổi lơ lửng. */
  #boot-bar {
    height: 6px; border-radius: 999px; overflow: hidden;
    background: #2b333d; border: 1px solid #3a444e;
  }
  /* #f0c419 = màu tên NPC của P5-01 §2.1.3 — 9,6:1 trên nền này. Xem src/ui/bootScreen.ts. */
  #boot-fill {
    display: block; height: 100%; width: 0; border-radius: 999px;
    background: #f0c419; transition: width .2s linear;
  }
  /*
   * Trạng thái KHÔNG XÁC ĐỊNH: bó mã còn đang tải nên chưa có số nào để hiện.
   *
   * Vạch trôi vẽ bằng gradient của RÃNH, không phải bằng bề rộng của #boot-fill. Cho
   * #boot-fill một bề rộng ở đây thì lúc rời trạng thái này nó phải co từ 34% về 2%, và
   * `transition: width` làm cú co đó thành một đoạn CHẠY NGƯỢC ngay trước khi tiến độ
   * thật bắt đầu. Để fill đứng ở 0 thì không có gì phải co.
   */
  #boot-bar.boot-wait {
    background-image: linear-gradient(90deg, transparent, #f0c419, transparent);
    background-size: 40% 100%; background-repeat: no-repeat;
    animation: boot-slide 1.3s ease-in-out infinite;
  }
  @keyframes boot-slide {
    0%, 100% { background-position: -45% 0; }
    50%      { background-position: 145% 0; }
  }
  /* 0,9rem = 14,4px ở mặc định — trên sàn 14px của P5-01 §2.1.1. */
  #boot-row {
    display: flex; justify-content: space-between; gap: 10px;
    margin-top: 9px; font-size: .9rem; letter-spacing: .02em; opacity: .8;
  }
  /* Chữ số không nhảy chỗ khi đổi từ "9%" sang "10%", và không bao giờ bị xuống dòng. */
  #boot-pct { font-variant-numeric: tabular-nums; white-space: nowrap; }

  @media (prefers-reduced-motion: reduce) {
    #boot { transition: none; }
    #boot-fill { transition: none; }
    /* Vạch trôi tắt HẲN, không đổi sang hiệu ứng khác. Dòng chữ bên dưới vẫn nói đang
       khởi động, nên bỏ cái vạch này không làm mất thông tin nào (P5-01 §1). */
    #boot-bar.boot-wait { animation: none; background-image: none; }
    #boot-bar.boot-wait > #boot-fill { width: 12%; }
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="boot">
    <div id="boot-box">
      <b>Bánh Mì Cô Ba</b>
      <div id="boot-bar" class="boot-wait" role="progressbar" aria-labelledby="boot-note"
           aria-valuemin="0" aria-valuemax="100"><i id="boot-fill"></i></div>
      <div id="boot-row">
        <span id="boot-note" aria-live="polite">đang khởi động…</span>
        <span id="boot-pct"></span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
